<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <rect width="400" height="240" fill="#f5efe4"/>

  <!-- hairline grid -->
  <g stroke="#0a0a0a" stroke-opacity="0.06" stroke-width="0.5">
    <line x1="0" y1="48" x2="400" y2="48"/>
    <line x1="0" y1="96" x2="400" y2="96"/>
    <line x1="0" y1="144" x2="400" y2="144"/>
    <line x1="0" y1="192" x2="400" y2="192"/>
    <line x1="80" y1="0" x2="80" y2="240"/>
    <line x1="160" y1="0" x2="160" y2="240"/>
    <line x1="240" y1="0" x2="240" y2="240"/>
    <line x1="320" y1="0" x2="320" y2="240"/>
  </g>

  <!-- top eyebrow -->
  <text x="20" y="28" font-family="JetBrains Mono, ui-monospace, monospace" font-weight="500" font-size="10" fill="#6b6b66" letter-spacing="0.18em">PRASÓWKA · GPW · WARSZAWA</text>

  <!-- ticker tape band -->
  <line x1="20" y1="46" x2="380" y2="46" stroke="#0a0a0a" stroke-width="1"/>
  <line x1="20" y1="86" x2="380" y2="86" stroke="#0a0a0a" stroke-width="1"/>

  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" font-weight="500" letter-spacing="0.06em">
    <text x="20" y="70" fill="#0a0a0a">PKN</text>     <text x="60"  y="70" fill="#2f6647">+1,28%</text>
    <text x="120" y="70" fill="#0a0a0a">KGH</text>    <text x="160" y="70" fill="#8a2e25">−0,84%</text>
    <text x="220" y="70" fill="#0a0a0a">PKO</text>    <text x="260" y="70" fill="#2f6647">+0,42%</text>
    <text x="320" y="70" fill="#0a0a0a">ALE</text>    <text x="356" y="70" fill="#8a2e25">−0,21%</text>
  </g>

  <!-- big serif WIG20 wordmark, paper -->
  <text x="200" y="160" text-anchor="middle" font-family="Instrument Serif, Georgia, serif" font-weight="400" font-style="italic" font-size="64" fill="#0a0a0a" letter-spacing="-0.01em">WIG20</text>

  <!-- candlestick row -->
  <g transform="translate(0,180)">
    <g stroke="#2f6647" stroke-width="1.4">
      <line x1="60" y1="2" x2="60" y2="32"/>
    </g>
    <rect x="55" y="10" width="10" height="14" fill="#2f6647"/>

    <g stroke="#8a2e25" stroke-width="1.4">
      <line x1="100" y1="0" x2="100" y2="34"/>
    </g>
    <rect x="95" y="6" width="10" height="22" fill="#8a2e25"/>

    <g stroke="#2f6647" stroke-width="1.4">
      <line x1="140" y1="4" x2="140" y2="30"/>
    </g>
    <rect x="135" y="12" width="10" height="12" fill="#2f6647"/>

    <g stroke="#2f6647" stroke-width="1.4">
      <line x1="260" y1="0" x2="260" y2="34"/>
    </g>
    <rect x="255" y="4" width="10" height="22" fill="#2f6647"/>

    <g stroke="#8a2e25" stroke-width="1.4">
      <line x1="300" y1="2" x2="300" y2="32"/>
    </g>
    <rect x="295" y="10" width="10" height="14" fill="#8a2e25"/>

    <g stroke="#2f6647" stroke-width="1.4">
      <line x1="340" y1="0" x2="340" y2="36"/>
    </g>
    <rect x="335" y="6" width="10" height="26" fill="#2f6647"/>
  </g>

  <!-- brass accent: the latest tick marker -->
  <circle cx="340" cy="180" r="3" fill="#c9a961"/>

  <!-- brand wordmark bottom -->
  <text x="200" y="226" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-weight="500" font-size="10" fill="#6b6b66" letter-spacing="0.18em">DOMENARYNKU.PL</text>
</svg>
