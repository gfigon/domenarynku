<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <rect width="400" height="240" fill="#f5efe4"/>

  <!-- hairline grid -->
  <g stroke="#0a0a0a" stroke-opacity="0.06" stroke-width="0.5">
    <line x1="0" y1="60" x2="400" y2="60"/>
    <line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="140" x2="400" y2="140"/>
    <line x1="0" y1="180" x2="400" y2="180"/>
    <line x1="80" y1="0" x2="80" y2="240"/>
    <line x1="160" y1="0" x2="160" y2="240"/>
    <line x1="240" y1="0" x2="240" y2="240"/>
    <line x1="320" y1="0" x2="320" y2="240"/>
  </g>

  <!-- top eyebrow -->
  <text x="20" y="28" font-family="JetBrains Mono, ui-monospace, monospace" font-weight="500" font-size="10" fill="#6b6b66" letter-spacing="0.18em">MAKRO · STOPY · INFLACJA</text>

  <!-- right-axis tick labels -->
  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="9" font-weight="500" fill="#8e8d85" letter-spacing="0.06em">
    <text x="384" y="64"  text-anchor="end">8%</text>
    <text x="384" y="104" text-anchor="end">6%</text>
    <text x="384" y="144" text-anchor="end">4%</text>
    <text x="384" y="184" text-anchor="end">2%</text>
  </g>

  <!-- inflation curve (smooth descending) -->
  <path d="M30,80 C70,82 100,90 130,100 S190,130 230,150 S310,178 380,184"
        stroke="#0a0a0a" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <path d="M30,80 C70,82 100,90 130,100 S190,130 230,150 S310,178 380,184 L380,210 L30,210 Z"
        fill="#0a0a0a" fill-opacity="0.04"/>

  <!-- NBP rate stair-step (brass) -->
  <polyline points="30,90 130,90 130,110 230,110 230,130 320,130 320,150 380,150"
            stroke="#c9a961" stroke-width="1.4" fill="none" stroke-linejoin="miter" stroke-linecap="square"/>

  <!-- legend -->
  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="9" font-weight="500" letter-spacing="0.14em">
    <line x1="30"  y1="218" x2="46" y2="218" stroke="#0a0a0a" stroke-width="1.6"/>
    <text x="52"  y="221" fill="#0a0a0a">CPI R/R</text>

    <line x1="120" y1="218" x2="136" y2="218" stroke="#c9a961" stroke-width="1.4"/>
    <text x="142" y="221" fill="#0a0a0a">STOPA NBP</text>

    <text x="380" y="221" text-anchor="end" fill="#6b6b66" letter-spacing="0.18em">DOMENARYNKU.PL</text>
  </g>
</svg>
