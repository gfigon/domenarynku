<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <rect width="400" height="240" fill="#f5efe4"/>

  <!-- hairline grid -->
  <g stroke="#0a0a0a" stroke-opacity="0.06" stroke-width="0.5">
    <line x1="0" y1="60" x2="400" y2="60"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="180" x2="400" y2="180"/>
  </g>

  <!-- top eyebrow -->
  <text x="20" y="28" font-family="JetBrains Mono, ui-monospace, monospace" font-weight="500" font-size="10" fill="#6b6b66" letter-spacing="0.18em">DYWIDENDY · GPW · 2026</text>

  <!-- coupon stack: three rows of ticker / amount with hairline rules -->
  <g font-family="JetBrains Mono, ui-monospace, monospace" font-weight="500">
    <line x1="40" y1="78" x2="360" y2="78" stroke="#0a0a0a" stroke-width="0.6"/>

    <text x="48"  y="100" font-size="13" fill="#0a0a0a" letter-spacing="0.06em">PKN</text>
    <text x="200" y="100" font-size="13" fill="#0a0a0a" letter-spacing="0.06em" text-anchor="middle">5,75 zł</text>
    <text x="352" y="100" font-size="11" fill="#6b6b66" letter-spacing="0.16em" text-anchor="end">+4,8%</text>
    <line x1="40" y1="116" x2="360" y2="116" stroke="#0a0a0a" stroke-opacity="0.3" stroke-width="0.6"/>

    <text x="48"  y="138" font-size="13" fill="#0a0a0a" letter-spacing="0.06em">KGH</text>
    <text x="200" y="138" font-size="13" fill="#0a0a0a" letter-spacing="0.06em" text-anchor="middle">2,40 zł</text>
    <text x="352" y="138" font-size="11" fill="#6b6b66" letter-spacing="0.16em" text-anchor="end">+2,1%</text>
    <line x1="40" y1="154" x2="360" y2="154" stroke="#0a0a0a" stroke-opacity="0.3" stroke-width="0.6"/>

    <text x="48"  y="176" font-size="13" fill="#0a0a0a" letter-spacing="0.06em">PZU</text>
    <text x="200" y="176" font-size="13" fill="#0a0a0a" letter-spacing="0.06em" text-anchor="middle">4,34 zł</text>
    <text x="352" y="176" font-size="11" fill="#6b6b66" letter-spacing="0.16em" text-anchor="end">+9,3%</text>
    <line x1="40" y1="192" x2="360" y2="192" stroke="#0a0a0a" stroke-width="0.6"/>
  </g>

  <!-- big italic accent -->
  <text x="380" y="60" text-anchor="end" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-weight="400" font-size="36" fill="#9a7d3e">zł</text>

  <!-- brand caption -->
  <text x="200" y="226" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-weight="500" font-size="10" fill="#6b6b66" letter-spacing="0.18em">DOMENARYNKU.PL · KALENDARZ DYWIDEND</text>
</svg>
